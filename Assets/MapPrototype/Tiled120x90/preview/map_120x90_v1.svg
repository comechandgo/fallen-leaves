<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <pattern id="minorGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minorGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#9fbe70"/>

  <g id="regions" opacity="0.85">
    <rect x="0" y="590" width="360" height="280" rx="24" fill="#b7d987" stroke="#537c3d" stroke-width="4"/>

    <rect x="260" y="430" width="540" height="360" rx="28" fill="#d0d982" stroke="#7e8d39" stroke-width="4"/>

    <rect x="80" y="80" width="560" height="400" rx="30" fill="#739d60" stroke="#34572b" stroke-width="4"/>

    <rect x="680" y="80" width="520" height="660" rx="32" fill="#719c82" stroke="#315a48" stroke-width="4"/>
    <text x="24" y="630" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#294323">A 初始河岸区</text>
    <text x="300" y="470" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#4f5b23">B 开阔草地区</text>
    <text x="480" y="120" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#183d20">C 林地区</text>
    <text x="720" y="120" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#173d31">D 古树湿地区</text>
  </g>

  <g id="river" filter="url(#shadow)">
    <polyline points="0,790 160,750 300,630 480,510 650,570 800,450 970,330 1100,200 1200,140" fill="none" stroke="#d8b56f" stroke-width="110" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,790 160,750 300,630 480,510 650,570 800,450 970,330 1100,200 1200,140" fill="none" stroke="#58a8ce" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,790 160,750 300,630 480,510 650,570 800,450 970,330 1100,200 1200,140" fill="none" stroke="#a9d9ee" stroke-opacity="0.55" stroke-width="8" stroke-dasharray="26 18"/>
  </g>

  <g id="lake" filter="url(#shadow)">
    <ellipse cx="940" cy="675" rx="100" ry="65" fill="#d8b56f"/>
    <ellipse cx="940" cy="675" rx="90" ry="55" fill="#58a8ce"/>
    <ellipse cx="940" cy="675" rx="62" ry="32" fill="none" stroke="#a9d9ee" stroke-opacity="0.65" stroke-width="6" stroke-dasharray="18 14"/>
    <text x="852" y="595" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#1d4e89">湖泊判定区</text>
  </g>

  <g id="obstacles" fill="#795548" stroke="#4e342e" stroke-width="3">
    <rect x="315" y="745" width="70" height="50" rx="12"/><rect x="460" y="730" width="120" height="40" rx="10" transform="rotate(15 520 750)"/>
    <rect x="615" y="545" width="70" height="50" rx="12" transform="rotate(-10 650 570)"/>
    <ellipse cx="250" cy="270" rx="40" ry="50"/><ellipse cx="420" cy="170" rx="35" ry="55"/>
    <rect x="430" y="325" width="140" height="50" rx="12" transform="rotate(-12 500 350)"/>
    <rect x="740" y="400" width="80" height="60" rx="12"/><ellipse cx="1000" cy="330" rx="45" ry="60"/>
    <rect x="950" y="505" width="140" height="50" rx="12" transform="rotate(20 1020 530)"/>
    <rect x="1060" y="180" width="80" height="60" rx="12"/>
  </g>

  <g id="landmarks" filter="url(#shadow)">
    <circle cx="1080" cy="100" r="72" fill="#d4763b" stroke="#704021" stroke-width="8"/>
    <circle cx="1080" cy="100" r="42" fill="#9b4d2e"/>
    <text x="970" y="38" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#5a251b">终局古树</text>
  </g>

  <g id="start" filter="url(#shadow)">
    <circle cx="180" cy="730" r="18" fill="#ef233c" stroke="#ffffff" stroke-width="6"/>
    <path d="M180 702 L168 728 L192 728 Z" fill="#ef233c"/>
    <text x="115" y="690" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#7a1020">镜头起点</text>
  </g>

  <rect width="1200" height="900" fill="url(#majorGrid)" pointer-events="none"/>
  <rect x="2" y="2" width="1196" height="896" fill="none" stroke="#264653" stroke-width="5"/>

  <g id="legend" transform="translate(22 18)">
    <rect width="430" height="150" rx="14" fill="#ffffff" fill-opacity="0.88" stroke="#264653" stroke-width="2"/>
    <text x="18" y="32" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#20323a">120m × 90m 地图原型｜32px = 1m</text>
    <line x1="18" y1="61" x2="43" y2="61" stroke="#58a8ce" stroke-width="12"/><text x="55" y="67" font-family="Microsoft YaHei, sans-serif" font-size="17">河流 / 湖泊：清理判定</text>
    <rect x="18" y="80" width="25" height="18" fill="#795548"/><text x="55" y="96" font-family="Microsoft YaHei, sans-serif" font-size="17">障碍物：散落点排除</text>
    <text x="18" y="128" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#555">叶子和杂物：全图可行走区域随机散落</text>
  </g>
</svg>
